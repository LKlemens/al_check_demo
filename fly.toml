# fly.toml app configuration file generated for al-check-demo on 2026-05-30T14:18:53Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'al-check-demo'
primary_region = 'ams'

[build]

[env]
  LIVEBOOK_APPS_PATH = '/apps'
  LIVEBOOK_IP = '0.0.0.0'
  LIVEBOOK_PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
